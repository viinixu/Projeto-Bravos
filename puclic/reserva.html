<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reserva - Bravos Churrascaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <header>
        <a id="logo" href="index.html">
            <img src="img/img-logo2.png" alt="Logo Bravos">
        </a>
        <nav id="navegacao">
            <ul class="nav nav-pills">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Voltar para a Home</a>
                </li>
            </ul>
        </nav>
    </header>

    <main style="min-height: 70vh; display: flex; justify-content: center; align-items: center;">
        <section id="area-reserva" style="background-color: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 100%; max-width: 500px;">
            <h2 style="color: #5b341d; font-family: 'Oswald', sans-serif; text-align: center; margin-bottom: 20px;">Faça sua Reserva</h2>

            <div id="mensagemAlerta" class="alert d-none" role="alert"></div>

            <form id="formReserva">
                <div class="mb-3">
                    <label for="mesa" class="form-label" style="font-weight: bold; color: #7a4120;">Preferência de Mesa</label>
                    <select class="form-select" id="mesa" required>
                        <option value="" disabled selected>Selecione uma opção...</option>
                        <option value="Salao Principal">Salão Principal</option>
                        <option value="Area Externa">Área Externa</option>
                        <option value="Proximo a Churrasqueira">Próximo à Churrasqueira</option>
                        <option value="Espaco Kids">Próximo ao Espaço Kids</option>
                    </select>
                </div>

                <div class="mb-4">
                    <label for="pessoas" class="form-label" style="font-weight: bold; color: #7a4120;">Quantidade de Pessoas</label>
                    <!-- O input number com max="10" trava a inserção de números maiores -->
                    <input type="number" class="form-control" id="pessoas" min="1" max="10" placeholder="Máximo de 10 pessoas" required>
                </div>

                <button type="submit" id="confirmarReserva" style="background-color: #24620e; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; transition: 0.3s;">Confirmar Reserva</button>
            </form>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
