<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sertanejo Raiz - Bravos Churrascaria</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body style="background-color: #f7eee2bf;">
    
    <!-- Cabeçalho simplificado para navegação -->
<header>
        <a id="logo" href="index.html">
            <img src="img/img-logo2.png" alt="Logo Bravos">
        </a>
        <!-- Botão do menu responsivo para celular -->
        <button id="menu-toggle" aria-label="Abrir menu">&#9776;</button>
        <nav id="navegacao">
            <ul class="nav nav-pills">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="index.html#quem-somos">Quem somos?</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="index.html#Menu">Menu</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="index.html#Eventos">Eventos</a>
                </li>
            </ul>
        </nav>
    </header>
    <main style="min-height: 80vh; display: flex; justify-content: center; align-items: center; padding: 20px;">
        <div style="background-color: white; padding: 40px; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 100%; max-width: 600px;">
            <h2 style="color: #5b341d; font-family: 'Oswald', sans-serif; text-align: center;">Noite do Sertanejo Raiz</h2>
            <p style="text-align: center; color: #d27a47; font-weight: bold;">Sexta, 17/07 - 20h</p>
            <p style="text-align: center; margin-bottom: 30px;">Selecione o tipo de ingresso para garantir sua mesa com rodízio premium completo.</p>

            <div id="mensagemAlertaEvento" class="alert d-none" role="alert"></div>

            <form id="formCompraEvento">
                <div class="form-check" style="border: 1px solid #e2d6cd; padding: 15px 15px 15px 40px; border-radius: 10px; margin-bottom: 15px;">
                    <input class="form-check-input" type="radio" name="tipoIngresso" id="ingressoLote1" value="Mesa Compartilhada" required>
                    <label class="form-check-label w-100 d-flex justify-content-between" for="ingressoLote1">
                        <span><strong>Mesa Compartilhada</strong><br><small class="text-muted">Ingresso Individual</small></span>
                        <span style="color: #24620e; font-weight: bold;">R$ 120,00</span>
                    </label>
                </div>

                <div class="form-check" style="border: 1px solid #e2d6cd; padding: 15px 15px 15px 40px; border-radius: 10px; margin-bottom: 15px;">
                    <input class="form-check-input" type="radio" name="tipoIngresso" id="ingressoLote2" value="Mesa Fechada (4 Pessoas)">
                    <label class="form-check-label w-100 d-flex justify-content-between" for="ingressoLote2">
                        <span><strong>Mesa Fechada</strong><br><small class="text-muted">Para 4 pessoas</small></span>
                        <span style="color: #24620e; font-weight: bold;">R$ 450,00</span>
                    </label>
                </div>

                <div class="form-check" style="border: 1px solid #e2d6cd; padding: 15px 15px 15px 40px; border-radius: 10px; margin-bottom: 25px;">
                    <input class="form-check-input" type="radio" name="tipoIngresso" id="ingressoLote3" value="Lounge VIP">
                    <label class="form-check-label w-100 d-flex justify-content-between" for="ingressoLote3">
                        <span><strong>Lounge VIP</strong><br><small class="text-muted">Próximo ao palco + 1 Garrafa de Vinho</small></span>
                        <span style="color: #24620e; font-weight: bold;">R$ 600,00</span>
                    </label>
                </div>

                <button type="button" onclick="simularCompra()" style="background-color: #24620e; color: white; width: 100%; padding: 12px; border: none; border-radius: 8px; font-weight: bold; font-family: Verdana, sans-serif;">Comprar Ingresso</button>
            </form>
        </div>
    </main>

    <script>
        function simularCompra() {
            const opcaoSelecionada = document.querySelector('input[name="tipoIngresso"]:checked');
            const mensagemAlerta = document.getElementById("mensagemAlertaEvento");
            const formulario = document.getElementById("formCompraEvento");

            if (opcaoSelecionada) {
                mensagemAlerta.textContent = `Sucesso! Você garantiu o ingresso: ${opcaoSelecionada.value}. (Simulação concluída)`;
                mensagemAlerta.classList.remove("d-none", "alert-danger");
                mensagemAlerta.classList.add("alert-success");
                formulario.style.display = "none";
            } else {
                mensagemAlerta.textContent = "Por favor, selecione uma opção de ingresso.";
                mensagemAlerta.classList.remove("d-none", "alert-success");
                mensagemAlerta.classList.add("alert-danger");
            }
        }
    </script>
    
    <script src="script.js"></script>
</body>
</html>
